      function shuffleArray(array) {
        const copy = [...array];
        for (let i = copy.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [copy[i], copy[j]] = [copy[j], copy[i]];
        }
        return copy;
      }

      const preparedQuestions = questions.map((item) => {
        const originalOptions = item.options;
        const originalAnswer = item.answer;
        const order = shuffleArray([0, 1, 2, 3]);
        const shuffledOptions = order.map((index) => originalOptions[index]);
        const newAnswer = order.indexOf(originalAnswer);

        return {
          ...item,
          options: shuffledOptions,
          answer: newAnswer
        };
      });

          input.type = 'radio';
          input.name = `q${index}`;
          input.value = optIndex;
          label.appendChild(input);
          label.appendChild(document.createTextNode(option));
          optionsWrapper.appendChild(label);
        });

        questionWrapper.appendChild(optionsWrapper);
        quizContainer.appendChild(questionWrapper);
      });

      form.addEventListener('submit', function (event) {
        event.preventDefault();

        let score = 0;
        const formData = new FormData(form);
        const mistakes = [];

        preparedQuestions.forEach((item, index) => {
          const selected = formData.get(`q${index}`);
          const selectedIndex = selected === null ? null : Number(selected);

          if (selectedIndex !== null && selectedIndex === item.answer) {
            score++;
          } else {
            mistakes.push({
              index,
              selectedIndex,
              selectedText: selectedIndex === null ? 'No answer selected' : item.options[selectedIndex],
              correctText: item.options[item.answer],
              explanation: item.explanation
            });
          }
        });

        scoreBanner.textContent = `Score: ${score} / ${totalQuestions}`;

        const passed = score >= passingScore;
        resultBox.className = `result ${passed ? 'pass' : 'fail'}`;
        resultBox.textContent = passed
          ? `Passed! You scored ${score}/${totalQuestions}. The passing score is ${passingScore}.`
          : `Failed. You scored ${score}/${totalQuestions}. The passing score is ${passingScore}. Try again.`;

        reviewBox.style.display = 'block';

        if (mistakes.length === 0) {
          reviewBox.innerHTML = '<h3>Perfect score! You got all answers right.</h3>';
          return;
        }

        reviewBox.innerHTML = `
          <h3>Review your mistakes:</h3>
          <ul>
            ${mistakes.map(m => `
              <li>
                <strong>Question ${m.index + 1}:</strong> You chose "${m.selectedText}".<br>
                <strong>Correct answer:</strong> "${m.correctText}"<br>
                <em>Why it was wrong:</em> ${m.explanation}
              </li>
            `).join('')}
          </ul>
        `;
      });
    </script>
  </body>
</html>
